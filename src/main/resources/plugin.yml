name: Chromatica
description: $description
version: '${version}'

main: com.mrkoszos.chromatica.Chromatica
api-version: '26.2'
load: POSTWORLD

softdepend: [PlaceholderAPI]

authors: [ mk ]
website: https://discord.gg/PjucdG2ESs

commands:
  chromatica:
    description: Open the Chromatica menu, or manage it (reload/reset/set) as an admin.
    usage: /chromatica [color|gradient|formatting|presets|favorites|reload|reset|set|clear]
    permission: chromatica.use
    aliases: [chroma, ch, namecolor, nc]

permissions:
  chromatica.use:
    description: Allows the player to use Chromatica.
    default: true
  chromatica.reload:
    description: Allows reloading the Chromatica presets.
    default: op
  chromatica.reset:
    description: Allows resetting another player's name style.
    default: op
  chromatica.set:
    description: Allows setting another player's preset.
    default: op
  chromatica.admin:
    description: Grants all Chromatica admin permissions.
    default: op
    children:
      chromatica.reload: true
      chromatica.reset: true
      chromatica.set: true
